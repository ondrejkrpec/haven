---
- name: Verify private access before application deployment
  ansible.builtin.import_playbook: verify.yml

- name: Deploy the bounded coordinator from an explicit native profile
  hosts: haven_hosts
  gather_facts: false
  become: true
  vars:
    haven_source: /var/lib/haven/releases/hermes-bf0203a-785f2646
    haven_state: /var/lib/haven/.hermes
    haven_tools: /var/lib/haven/haven-tools
    haven_capabilities_enabled: "{{ (lookup('ansible.builtin.file', haven_model_config) | from_yaml).get('plugins', {}).get('enabled', []) == ['haven-capabilities'] }}"
    haven_wishlist_enabled: "{{ 'wishlist' in (lookup('ansible.builtin.file', haven_model_config) | from_yaml).get('plugins', {}).get('entries', {}).get('haven-capabilities', {}).get('settings', {}) }}"
    haven_whatsapp_enabled: "{{ (lookup('ansible.builtin.file', haven_model_config) | from_yaml).get('platforms', {}).get('whatsapp', {}).get('enabled', false) }}"
    haven_telegram_enabled: "{{ (lookup('ansible.builtin.file', haven_model_config) | from_yaml).get('platforms', {}).get('telegram', {}).get('enabled', false) }}"
    haven_python: >-
      {{ '/var/lib/haven/telegram/venv/bin/python' if haven_telegram_enabled | bool else
         '/var/lib/haven/whatsapp/venv/bin/python' if haven_whatsapp_enabled | bool else haven_source + '/venv/bin/python' }}
  pre_tasks:
    - name: Require an explicit deployment and native configuration
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - haven_service_authorized | default(false) | bool
          - haven_model_config is defined
        fail_msg: Explicit service deployment and a freshly rendered service profile are required.

    - name: Inspect existing native configuration
      ansible.builtin.stat:
        path: "{{ haven_state }}/config.yaml"
      register: haven_existing_config

    - name: Require the separately prepared dependency artifact for wishlist ingress
      ansible.builtin.assert:
        that: haven_wishlist_dependencies is defined
      when: haven_wishlist_enabled | bool

    - name: Verify the explicit wishlist dependency artifact before deployment
      ansible.builtin.command:
        argv: ["{{ ansible_playbook_python }}", -m, scripts.wishlist_dependencies, verify-bundle,
               --directory, "{{ haven_wishlist_dependencies }}"]
        chdir: "{{ playbook_dir }}/.."
      delegate_to: localhost
      become: false
      changed_when: false
      check_mode: false
      when: haven_wishlist_enabled | bool

    - name: Inspect the existing coordinator dependency manifest
      ansible.builtin.stat:
        path: "{{ haven_tools }}/vendor/wishlist-dependencies.json"
        checksum_algorithm: sha256
      register: haven_coordinator_vendor_manifest
      when: haven_wishlist_enabled | bool

    - name: Preserve dependency artifacts referenced by application rollback
      ansible.builtin.assert:
        that: haven_coordinator_vendor_manifest.stat.checksum == lookup('ansible.builtin.file', haven_wishlist_dependencies + '/wishlist-dependencies.json', rstrip=false) | hash('sha256')
      when:
        - haven_wishlist_enabled | bool
        - haven_coordinator_vendor_manifest.stat.exists

    - name: Require the accepted runtime profile
      ansible.builtin.assert:
        that: haven_existing_config.stat.isreg | default(false)

    - name: Resolve the fixed service identity for its native worker manager
      ansible.builtin.command:
        argv: [id, -u, haven]
      register: haven_uid
      changed_when: false
      check_mode: false

  tasks:
    - name: Inspect the optional backup maintenance exclusion service
      ansible.builtin.stat:
        path: /etc/systemd/system/haven-maintenance.service
      register: haven_maintenance_unit

    - name: Select a distinct maintenance lease for this invocation
      ansible.builtin.set_fact:
        haven_maintenance_lease: "haven-maintenance-{{ lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_lowercase', 'digits']) }}"
      when: haven_maintenance_unit.stat.exists

    - name: Hold the shared maintenance exclusion during application changes
      ansible.builtin.command:
        argv:
          - systemd-run
          - "--unit={{ haven_maintenance_lease }}"
          - --collect
          - --property=Type=notify
          - --property=TimeoutStartSec=10
          - --property=UMask=0077
          - --setenv=PYTHONPATH=/usr/local/lib/haven-backup
          - --setenv=PYTHONDONTWRITEBYTECODE=1
          - /usr/bin/python3
          - -m
          - scripts.backup_runtime
          - maintenance
      changed_when: true
      when: haven_maintenance_unit.stat.exists

    - name: Apply the application under maintenance exclusion
      block:
        - name: Snapshot only application configuration and service code
          ansible.builtin.script:
            cmd: ../scripts/service_snapshot.py snapshot
            executable: /usr/bin/python3
          register: haven_snapshot
          changed_when: false
          when: not ansible_check_mode

        - name: Install and accept the bounded application
          block:
            - name: Provide the native restart-safe worker user manager
              ansible.builtin.command:
                argv: [loginctl, enable-linger, haven]
                creates: /var/lib/systemd/linger/haven

            - name: Ensure the service user bus is available before starting Hermes
              ansible.builtin.systemd_service:
                name: "user@{{ haven_uid.stdout }}.service"
                state: started

            - name: Protect the trusted service code directories
              ansible.builtin.file:
                path: "{{ item }}"
                state: directory
                owner: root
                group: haven
                mode: '0750'
              loop: ["{{ haven_tools }}", "{{ haven_tools }}/scripts", "{{ haven_tools }}/config"]

            - name: Install the fixed service contract and guard
              ansible.builtin.copy:
                src: "../scripts/{{ item }}"
                dest: "{{ haven_tools }}/scripts/{{ item }}"
                owner: root
                group: haven
                mode: '0640'
              loop: [model_contract.py, model_probe.py, service_runtime.py, whatsapp_runtime.py, telegram_runtime.py]
              notify: Restart Haven

            - name: Install the exact WhatsApp dependency pins
              ansible.builtin.copy:
                src: ../config/whatsapp-runtime.json
                dest: "{{ haven_tools }}/config/whatsapp-runtime.json"
                owner: root
                group: haven
                mode: '0640'
              notify: Restart Haven

            - name: Install the exact Telegram dependency pins
              ansible.builtin.copy:
                src: ../config/telegram-runtime.json
                dest: "{{ haven_tools }}/config/telegram-runtime.json"
                owner: root
                group: haven
                mode: '0640'
              notify: Restart Haven

            - name: Install the explicitly rendered native service configuration
              ansible.builtin.copy:
                src: "{{ haven_model_config }}"
                dest: "{{ haven_state }}/config.yaml"
                owner: haven
                group: haven
                mode: '0600'
                backup: true
              no_log: true
              notify: Restart Haven

            - name: Prepare the explicitly selected deterministic capability mode
              when: haven_capabilities_enabled | bool
              block:
                - name: Install the capability policy and guarded launcher
                  ansible.builtin.copy:
                    src: "../scripts/{{ item }}.py"
                    dest: "{{ haven_tools }}/scripts/{{ item }}.py"
                    owner: root
                    group: haven
                    mode: '0640'
                  loop: [capability_policy, capability_runtime, capability_gateway, prepare_capabilities]
                  notify: Restart Haven

                - name: Install the exact capability registry and source pins
                  ansible.builtin.copy:
                    src: "../config/{{ item }}"
                    dest: "{{ haven_tools }}/config/{{ item }}"
                    owner: root
                    group: haven
                    mode: '0640'
                  loop: [capabilities.json, capability-runtime.json]
                  notify: Restart Haven

                - name: Install wishlist ingress dependencies with the capability plugin
                  ansible.builtin.copy:
                    src: "../scripts/{{ item }}.py"
                    dest: "{{ haven_tools }}/scripts/{{ item }}.py"
                    owner: root
                    group: haven
                    mode: '0640'
                  loop: [wishlist_contract, wishlist_domain, wishlist_ingress, wishlist_interpreter,
                         wishlist_language, wishlist_language_contract, wishlist_model, wishlist_protocol,
                         wishlist_service, wishlist_socket, wishlist_store, wishlist_telegram, wishlist_dependencies]
                  notify: Restart Haven

                - name: Prepare the wishlist schema directory
                  ansible.builtin.file:
                    path: "{{ haven_tools }}/schemas"
                    state: directory
                    owner: root
                    group: haven
                    mode: '0750'

                - name: Install the exact wishlist schema and source contracts
                  ansible.builtin.copy:
                    src: "../{{ item }}"
                    dest: "{{ haven_tools }}/{{ item }}"
                    owner: root
                    group: haven
                    mode: '0640'
                  loop: [schemas/wishlist-request-v1.schema.json, config/wishlist-runtime.json,
                         config/wishlist-language-runtime.json]
                  notify: Restart Haven

                - name: Stage the bounded native host policy patch
                  ansible.builtin.copy:
                    src: ../research/h1.6.1/deterministic-policy.patch
                    dest: "{{ haven_tools }}/config/deterministic-policy.patch"
                    owner: root
                    group: haven
                    mode: '0640'

                - name: Check the exact native capability patch before stopping the service
                  ansible.builtin.command:
                    argv:
                      - /usr/sbin/runuser
                      - -u
                      - haven
                      - --
                      - /usr/bin/env
                      - "PYTHONPATH={{ haven_tools }}:{{ haven_tools }}/vendor"
                      - "{{ haven_python }}"
                      - -m
                      - scripts.prepare_capabilities
                      - --source
                      - "{{ haven_source }}"
                      - --patch
                      - "{{ haven_tools }}/config/deterministic-policy.patch"
                  register: haven_capability_patch
                  changed_when: false
                  when: not ansible_check_mode

                - name: Stop the coordinator before modifying its native code
                  ansible.builtin.systemd_service:
                    name: haven.service
                    state: stopped
                  when:
                    - not ansible_check_mode
                    - (haven_capability_patch.stdout | from_json).changed

                - name: Apply the verified native policy patch
                  ansible.builtin.command:
                    argv:
                      - /usr/sbin/runuser
                      - -u
                      - haven
                      - --
                      - /usr/bin/env
                      - "PYTHONPATH={{ haven_tools }}:{{ haven_tools }}/vendor"
                      - "{{ haven_python }}"
                      - -m
                      - scripts.prepare_capabilities
                      - --source
                      - "{{ haven_source }}"
                      - --patch
                      - "{{ haven_tools }}/config/deterministic-policy.patch"
                      - --apply
                  changed_when: true
                  when:
                    - not ansible_check_mode
                    - (haven_capability_patch.stdout | from_json).changed
                  notify: Restart Haven

                - name: Protect the fixed trusted and instance plugin directories
                  ansible.builtin.file:
                    path: "{{ item }}"
                    state: directory
                    owner: root
                    group: haven
                    mode: '0750'
                  loop:
                    - "{{ haven_tools }}/plugins"
                    - "{{ haven_tools }}/plugins/haven-capabilities"
                    - "{{ haven_state }}/plugins"
                    - "{{ haven_state }}/plugins/haven-capabilities"

                - name: Install only the two declared plugin files
                  ansible.builtin.copy:
                    src: "../plugins/haven-capabilities/{{ item.1 }}"
                    dest: "{{ item.0 }}/{{ item.1 }}"
                    owner: root
                    group: haven
                    mode: '0640'
                  loop: "{{ [haven_tools + '/plugins/haven-capabilities', haven_state + '/plugins/haven-capabilities'] | product(['plugin.yaml', '__init__.py']) | list }}"
                  notify: Restart Haven

            - name: Create the coordinator dependency directory
              ansible.builtin.file:
                path: "{{ haven_tools }}/vendor"
                state: directory
                owner: root
                group: haven
                mode: '0750'
              when: haven_wishlist_enabled | bool

            - name: Install the independently prepared wishlist dependencies
              ansible.builtin.unarchive:
                src: "{{ haven_wishlist_dependencies }}.tar.gz"
                dest: "{{ haven_tools }}/vendor"
                owner: root
                group: haven
                mode: 'u=rwX,g=rX,o='
              when: haven_wishlist_enabled | bool
              notify: Restart Haven

            - name: Install the independent wishlist dependency lock
              ansible.builtin.copy:
                src: ../requirements-wishlist.txt
                dest: "{{ haven_tools }}/requirements-wishlist.txt"
                owner: root
                group: haven
                mode: '0640'
              when: haven_wishlist_enabled | bool
              notify: Restart Haven

            - name: Verify the installed coordinator dependency artifact
              ansible.builtin.command:
                argv: ["{{ haven_python }}", -B, -m, scripts.wishlist_dependencies, verify,
                       --directory, "{{ haven_tools }}/vendor"]
                chdir: "{{ haven_tools }}"
              environment:
                PYTHONPATH: "{{ haven_tools }}"
              become: true
              become_user: haven
              changed_when: false
              when:
                - haven_wishlist_enabled | bool
                - not ansible_check_mode

            - name: Validate the service policy without resolving credentials
              ansible.builtin.command:
                argv:
                  - /usr/sbin/runuser
                  - -u
                  - haven
                  - --
                  - /usr/bin/env
                  - "HERMES_HOME={{ haven_state }}"
                  - "PYTHONPATH={{ haven_tools }}:{{ haven_tools }}/vendor"
                  - "{{ haven_python }}"
                  - -m
                  - scripts.service_runtime
                  - check
                  - --source
                  - "{{ haven_source }}"
                  - --home
                  - "{{ haven_state }}"
              changed_when: false
              when: not ansible_check_mode

            - name: Install the supervised system service
              ansible.builtin.template:
                src: haven.service.j2
                dest: /etc/systemd/system/haven.service
                owner: root
                group: root
                mode: '0644'
              notify: Restart Haven

            - name: Validate the installed unit before loading it
              ansible.builtin.command:
                argv: [systemd-analyze, verify, /etc/systemd/system/haven.service]
              changed_when: false
              when: not ansible_check_mode

            - name: Apply pending service changes
              ansible.builtin.meta: flush_handlers

            - name: Enable the coordinator at boot and ensure it is running
              ansible.builtin.systemd_service:
                name: haven.service
                daemon_reload: true
                enabled: true
                state: started

            - name: Accept a live gateway and a fresh event loop heartbeat
              ansible.builtin.command:
                argv:
                  - /usr/sbin/runuser
                  - -u
                  - haven
                  - --
                  - /usr/bin/env
                  - "HERMES_HOME={{ haven_state }}"
                  - "PYTHONPATH={{ haven_tools }}:{{ haven_tools }}/vendor"
                  - "{{ haven_python }}"
                  - -m
                  - scripts.service_runtime
                  - health
                  - --source
                  - "{{ haven_source }}"
                  - --home
                  - "{{ haven_state }}"
              register: haven_health
              changed_when: false
              until: haven_health.rc == 0
              retries: 6
              delay: 5
              when: not ansible_check_mode

          rescue:
            - name: Restore the previous application state after deployment failure
              ansible.builtin.script:
                cmd: >-
                  ../scripts/service_snapshot.py restore
                  --snapshot {{ (haven_snapshot.stdout | from_json).snapshot | quote }}
                executable: /usr/bin/python3
              when: not ansible_check_mode

            - name: Report the failed application deployment
              ansible.builtin.fail:
                msg: Service deployment failed; the previous application snapshot was restored.

      always:
        - name: Release the application maintenance exclusion
          ansible.builtin.systemd_service:
            name: "{{ haven_maintenance_lease }}.service"
            state: stopped
          when: haven_maintenance_unit.stat.exists

  handlers:
    - name: Restart Haven
      ansible.builtin.systemd_service:
        name: haven.service
        daemon_reload: true
        state: restarted
